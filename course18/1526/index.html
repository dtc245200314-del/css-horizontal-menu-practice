<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gộp ô trong bảng với rowspan và colspan</title><link rel="stylesheet" href="style.css"></head><body><main><p class="label">Thực hành 1526</p><h1>Gộp ô trong bảng với rowspan và colspan</h1><h2>Thời khóa biểu</h2>
<table border="1">
    <tr>
        <th>Thứ</th>
        <th>Môn học</th>
        <th>Giáo viên</th>
    </tr>
    <tr>
        <td rowspan="2">Thứ Hai</td>
        <td>Toán</td>
        <td>Thầy Nam</td>
    </tr>
    <tr>
        <td>Văn</td>
        <td>Cô Hạnh</td>
    </tr>
    <tr>
        <td>Thứ Ba</td>
        <td colspan="2">Nghỉ học</td>
    </tr>
</table></main></body></html>
