<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tạo giao diện form đăng ký người dùng</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Đăng ký người dùng</h1><form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST"><label for="name">Họ và tên</label><input id="name" name="name" type="text" required><label for="email">Email</label><input id="email" name="email" type="email" required><label for="phone">Số điện thoại</label><input id="phone" name="phone" type="tel" required><fieldset><legend>Giới tính</legend><label><input type="radio" name="gender" value="Nam" checked> Nam</label><label><input type="radio" name="gender" value="Nữ" > Nữ</label><label><input type="radio" name="gender" value="Khác" > Khác</label></fieldset><button type="submit">Đăng ký</button></form></main></body></html>
