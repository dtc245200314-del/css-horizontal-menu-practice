<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thiết kế Trang Đăng Ký với Bootstrap Forms</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"><link rel="stylesheet" href="style.css"></head><body><main class="container py-5"><div class="row justify-content-center"><div class="col-12 col-md-8 col-lg-6"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h2 text-center">Đăng ký tài khoản</h1><p class="text-muted text-center">Điền thông tin để hoàn tất biểu mẫu.</p><form id="registration"><div class="mb-3"><label class="form-label" for="name">Họ và tên</label><input required class="form-control" id="name" name="name" autocomplete="name"></div><div class="mb-3"><label class="form-label" for="email">Email</label><div class="input-group"><span class="input-group-text">@</span><input required type="email" class="form-control" id="email" name="email" autocomplete="email"></div></div><div class="mb-3"><label class="form-label" for="password">Mật khẩu</label><input required type="password" minlength="8" class="form-control" id="password" name="password" autocomplete="new-password" aria-describedby="passwordHelp"><div id="passwordHelp" class="form-text">Tối thiểu 8 ký tự.</div></div><div class="mb-3"><label class="form-label" for="confirmPassword">Xác nhận mật khẩu</label><input required type="password" class="form-control" id="confirmPassword" name="confirmPassword" autocomplete="new-password"></div><fieldset class="mb-3"><legend class="fs-6">Giới tính</legend><div class="form-check form-check-inline"><input type="radio" class="form-check-input" id="gender0" name="gender" value="Nam" checked><label class="form-check-label" for="gender0">Nam</label></div><div class="form-check form-check-inline"><input type="radio" class="form-check-input" id="gender1" name="gender" value="Nữ" ><label class="form-check-label" for="gender1">Nữ</label></div><div class="form-check form-check-inline"><input type="radio" class="form-check-input" id="gender2" name="gender" value="Khác" ><label class="form-check-label" for="gender2">Khác</label></div></fieldset><fieldset class="mb-3"><legend class="fs-6">Sở thích</legend><div class="form-check"><input type="checkbox" class="form-check-input" id="hobby0" name="hobby" value="Đọc sách"><label class="form-check-label" for="hobby0">Đọc sách</label></div><div class="form-check"><input type="checkbox" class="form-check-input" id="hobby1" name="hobby" value="Thể thao"><label class="form-check-label" for="hobby1">Thể thao</label></div><div class="form-check"><input type="checkbox" class="form-check-input" id="hobby2" name="hobby" value="Lập trình"><label class="form-check-label" for="hobby2">Lập trình</label></div></fieldset><div class="mb-4"><label class="form-label" for="country">Quốc gia</label><select id="country" name="country" class="form-select"><option value="VN">Việt Nam</option><option value="SG">Singapore</option><option value="JP">Nhật Bản</option><option value="US">Hoa Kỳ</option></select></div><button type="submit" class="btn btn-primary w-100">Đăng ký</button><p class="text-success mt-3" role="status"></p></form></div></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script><script src="script.js"></script></body></html>
