<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tạo form đơn giản</title><link rel="stylesheet" href="style.css"><script defer src="script.js"></script></head><body><main><h1>Biểu mẫu thông tin</h1><section class="card"><h2>Sở thích của bạn</h2><form data-demo><label for="yourname">Họ và tên</label><input id="yourname" name="yourname" type="text" required><label for="email">Email</label><input id="email" name="email" type="email" required><fieldset><legend>Sở thích</legend><label><input type="checkbox" name="hobby" value="Thể thao" > Thể thao</label><label><input type="checkbox" name="hobby" value="Âm nhạc" > Âm nhạc</label><label><input type="checkbox" name="hobby" value="Đọc sách" > Đọc sách</label><label><input type="checkbox" name="hobby" value="Lướt web" > Lướt web</label><label><input type="checkbox" name="hobby" value="Chơi game" > Chơi game</label><label><input type="checkbox" name="hobby" value="Điện ảnh" > Điện ảnh</label><label><input type="checkbox" name="hobby" value="Du lịch" > Du lịch</label></fieldset><div class="actions"><button type="submit">Gửi thông tin</button><button type="reset">Nhập lại</button></div><p role="status" class="status"></p></form></section><section class="card"><h2>Đăng ký học viên</h2><form data-demo><label for="fullname">Họ và tên</label><input id="fullname" name="fullname" type="text" required><label for="student-email">Email</label><input id="student-email" name="email" type="email" required><label for="phone">Số điện thoại</label><input id="phone" name="phone" type="tel" required><label for="birthday">Ngày sinh</label><input id="birthday" name="birthday" type="date" ><fieldset><legend>Giới tính</legend><label><input type="radio" name="gender" value="Nam" checked> Nam</label><label><input type="radio" name="gender" value="Nữ" > Nữ</label><label><input type="radio" name="gender" value="Khác" > Khác</label></fieldset><label for="address">Địa chỉ</label><textarea id="address" name="address" rows="3"></textarea><label for="course">Khóa học</label><select id="course" name="course"><option>HTML & CSS</option><option>JavaScript</option><option>Java</option><option>Python</option></select><fieldset><legend>Hình thức học</legend><label><input type="radio" name="study_type" value="Online" checked> Online</label><label><input type="radio" name="study_type" value="Offline" > Offline</label></fieldset><fieldset><legend>Sở thích</legend><label><input type="checkbox" name="hobby" value="Đọc sách" > Đọc sách</label><label><input type="checkbox" name="hobby" value="Thể thao" > Thể thao</label><label><input type="checkbox" name="hobby" value="Lập trình" > Lập trình</label></fieldset><label for="note">Ghi chú</label><textarea id="note" name="note" rows="3"></textarea><div class="actions"><button type="submit">Đăng ký</button><button type="reset">Nhập lại</button></div><p role="status" class="status"></p></form></section></main></body></html>
