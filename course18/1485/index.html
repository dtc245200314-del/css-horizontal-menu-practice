<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tạo form cơ bản</title><link rel="stylesheet" href="style.css"></head><body><main><form method="get" action="simpleform.html" class="wufoo"><h1>Order Form</h1><p><label for="product">What would you like to buy?</label></p><select id="product" name="product"><option value="A">A</option><option value="B">B (+ $0.5)</option><option value="C">C (+ $0.5)</option></select><fieldset><legend>How many would you like to order?</legend><label><input type="radio" name="quantity" value="1" checked> 1 - $10</label><br><label><input type="radio" name="quantity" value="2" > 2 - $20</label><br><label><input type="radio" name="quantity" value="3" > 3 - $25</label><br></fieldset><p>Name <span aria-label="required">*</span></p><label>First name <input required name="firstname" placeholder="FirstName" size="15"></label> <label>Last name <input required name="lastname" placeholder="LastName" size="15"></label><p><label>Email <input type="email" name="email" size="35"></label></p><fieldset><legend>Phone Number</legend><input aria-label="Phone part 1" type="tel" name="phone1" size="5"> - <input aria-label="Phone part 2" type="tel" name="phone2" size="5"> - <input aria-label="Phone part 3" type="tel" name="phone3" size="5"></fieldset><p><button type="submit">Submit</button></p></form></main></body></html>
