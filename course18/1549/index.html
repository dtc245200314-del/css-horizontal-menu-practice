<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tạo Trang Đăng Ký Người Dùng</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"><link rel="stylesheet" href="style.css"></head><body><main class="container py-5"><div class="row gy-5 gx-4 align-items-center"><section class="col-lg-6"><h1 class="display-5 fw-bold">Bắt đầu điều gì đó mới.</h1><p class="lead text-secondary">Một không gian để học hỏi, chia sẻ và cùng tiến bộ.</p><div id="benefitsCarousel" class="carousel slide rounded overflow-hidden" data-bs-interval="false"><div class="carousel-inner"><div class="carousel-item active"><img src="images/slide0.svg" class="d-block w-100" alt="Cùng nhau học hỏi"></div><div class="carousel-item "><img src="images/slide1.svg" class="d-block w-100" alt="Sắp xếp ý tưởng"></div><div class="carousel-item "><img src="images/slide2.svg" class="d-block w-100" alt="Xây dựng sản phẩm"></div></div><button class="carousel-control-prev" type="button" data-bs-target="#benefitsCarousel" data-bs-slide="prev" aria-label="Ảnh trước"><span class="carousel-control-prev-icon" aria-hidden="true"></span></button><button class="carousel-control-next" type="button" data-bs-target="#benefitsCarousel" data-bs-slide="next" aria-label="Ảnh tiếp"><span class="carousel-control-next-icon" aria-hidden="true"></span></button></div></section><section class="col-lg-6"><div class="card shadow-sm"><div class="card-body p-4"><h2 class="h3">Tạo tài khoản</h2><form id="registration"><div class="mb-3"><label class="form-label" for="name">Họ và tên</label><input required class="form-control" id="name" name="name" autocomplete="name"></div><div class="mb-3"><label class="form-label" for="email">Email</label><div class="input-group"><span class="input-group-text">@</span><input required type="email" class="form-control" id="email" name="email" autocomplete="email"></div></div><div class="mb-3"><label class="form-label" for="password">Mật khẩu</label><input required type="password" minlength="8" class="form-control" id="password" name="password" autocomplete="new-password" aria-describedby="passwordHelp"><div id="passwordHelp" class="form-text">Tối thiểu 8 ký tự.</div></div><div class="mb-3"><label class="form-label" for="confirmPassword">Xác nhận mật khẩu</label><input required type="password" class="form-control" id="confirmPassword" name="confirmPassword" autocomplete="new-password"></div><button type="submit" class="btn btn-primary w-100">Đăng ký</button><p role="status" class="text-success mt-3"></p></form></div></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script><script src="script.js"></script></body></html>
