<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thiết kế UI/UX giao diện trang đăng ký người dùng.</title><link rel="stylesheet" href="style.css"><script defer src="script.js"></script></head><body><main><section class="card"><form id="signup"><h1>Tạo tài khoản</h1><p>Tham gia không gian học tập của bạn.</p><label for="fullname">Họ và tên</label><input id="fullname" name="fullname" type="text" autocomplete="name" required><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Mật khẩu</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="password-help"><small id="password-help">Tối thiểu 8 ký tự.</small><label for="confirm-password">Xác nhận mật khẩu</label><input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" required><p id="error" role="alert"></p><button type="submit">Tạo tài khoản</button><p class="muted">Các trường đều bắt buộc.</p></form></section></main></body></html>
